name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, build, and Docker image verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle tests (unit only, excludes @Tag integration)
        run: ./gradlew test --no-daemon --stacktrace

      - name: Gradle clean build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify Docker image build (no registry push)
        run: docker build -t fan-cafe-backend:ci-test .
