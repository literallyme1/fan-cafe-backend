name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, build, and Docker image verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SPRING_PROFILES_ACTIVE: ci

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fan_cafe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate CI test RSA keys (ephemeral, not committed)
        run: |
          set -euo pipefail
          mkdir -p src/main/resources/key

          openssl genpkey \
            -algorithm RSA \
            -out src/main/resources/key/ci-private_key.pem \
            -pkeyopt rsa_keygen_bits:2048

          openssl rsa \
            -pubout \
            -in src/main/resources/key/ci-private_key.pem \
            -out src/main/resources/key/ci-public_key.pem

          chmod 600 src/main/resources/key/ci-private_key.pem
          chmod 644 src/main/resources/key/ci-public_key.pem

          echo "CI test RSA keys directory listing (metadata only):"
          ls -al src/main/resources/key

      - name: Run Gradle tests
        run: ./gradlew test -PincludeIntegration --no-daemon

      - name: Gradle clean build
        run: ./gradlew clean build -PincludeIntegration --no-daemon

      - name: Verify Docker image build (no registry push)
        run: docker build -t fan-cafe-backend:ci-test .
