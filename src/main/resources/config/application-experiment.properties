spring.application.name=fan-cafe
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/fan_cafe?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.sql.init.mode=never

payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8081}
payment.service.connect-timeout=2s
payment.service.read-timeout=2s

saga.recovery.enabled=${SAGA_RECOVERY_ENABLED:true}
saga.recovery.fixed-delay=${SAGA_RECOVERY_FIXED_DELAY:100ms}
saga.recovery.batch-size=${SAGA_RECOVERY_BATCH_SIZE:100}
saga.recovery.experiment-concurrency=${SAGA_RECOVERY_CONCURRENCY:1}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.s3.bucket=saga-step8-experiment
spring.mail.host=localhost
spring.mail.port=1025
slack.webhook.enabled=false
scheduler.comment-count.enabled=false
redis.warmup.enabled=false

jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:classpath:key/private_key.pem}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:classpath:key/public_key.pem}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase/service-account.json}
mock.pg.webhook-secret=${MOCK_PG_WEBHOOK_SECRET:saga-step8-experiment-secret}
