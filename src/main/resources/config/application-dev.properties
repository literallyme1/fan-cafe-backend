spring.application.name=fan-cafe

# --- Database ---
spring.datasource.url=${DB_URL:?DB_URL is required}
spring.datasource.username=${DB_USERNAME:?DB_USERNAME is required}
spring.datasource.password=${DB_PASSWORD:?DB_PASSWORD is required}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:?REDIS_HOST is required}
spring.data.redis.port=${REDIS_PORT:?REDIS_PORT is required}

# --- AWS / S3 ---
spring.cloud.aws.region.static=${AWS_REGION:?AWS_REGION is required}
spring.cloud.aws.s3.bucket=${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}

# --- Mail ---
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:?MAIL_PORT is required}

# --- Server ---
server.port=${SERVER_PORT}

# --- Actuator Basic Auth ---
spring.security.user.name=${ACTUATOR_USER:?ACTUATOR_USER is required}
spring.security.user.password=${ACTUATOR_PASSWORD:?ACTUATOR_PASSWORD is required}
spring.security.user.roles=ACTUATOR

# --- Slack ---
slack.webhook.enabled=true

# --- MQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:?RABBITMQ_HOST is required}
spring.rabbitmq.port=${RABBITMQ_PORT:?RABBITMQ_PORT is required}
spring.rabbitmq.username=${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
