spring.application.name=fan-cafe

logging.level.root=WARN

# --- Database (GitHub Actions service containers -> localhost) ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/fan_cafe?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# --- Redis ---
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# --- AWS / S3 (context load only; no real upload in CI) ---
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.s3.bucket=fan-cafe-ci

# --- Mail ---
spring.mail.host=localhost
spring.mail.port=1025

server.port=8080

# --- Actuator Basic Auth ---
spring.security.user.name=healthcheck
spring.security.user.password=ci-health-password
spring.security.user.roles=ACTUATOR
management.endpoints.web.exposure.include=health

# --- Slack (disabled in CI) ---
slack.webhook.enabled=false

# --- MQ ---
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

scheduler.comment-count.enabled=false

spring.sql.init.mode=always
spring.sql.init.separator=;;
spring.sql.init.data-locations=classpath:data-outbox.sql
redis.warmup.enabled=false

mock.pg.webhook-secret=ci-mock-pg-webhook-secret

# --- JWT (CI-only test keys; restored from GitHub Secrets in CI, never committed) ---
jwt.private-key-path=file:${user.dir}/src/main/resources/key/ci-private_key.pem
jwt.public-key-path=file:${user.dir}/src/main/resources/key/ci-public_key.pem
