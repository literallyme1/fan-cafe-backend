spring.application.name=fan-cafe
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Legacy local/test schemas are still managed by their existing JPA/SQL setup.
# Production and experiment profiles explicitly enable the Order DB migration path.
spring.flyway.enabled=false

jwt.access-token-expiration=900000
jwt.refresh-token-expiration=1209600000

spring.http.encoding.charset=UTF-8
logging.level.root=INFO

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.data.redis.timeout=500ms

# Outbox idempotency Redis 캐시 TTL (processed:{eventId}:{consumerType})
outbox.idempotency.redis-ttl-hours=12
spring.rabbitmq.connection-timeout=500
spring.rabbitmq.publisher-confirm-type=simple
outbox.publisher.confirm-timeout-ms=5000

# Saga recovery. refund-result-timeout is the deadline for the normal MQ refund result,
# not an immediate failure/retry interval.
saga.recovery.enabled=true
saga.recovery.fixed-delay=5s
saga.recovery.batch-size=10
saga.recovery.max-retry-count=3
saga.recovery.payment-unknown-initial-delay=10s
saga.recovery.order-completion-initial-delay=10s
saga.recovery.refund-result-timeout=1m
saga.recovery.base-delay=5s
saga.recovery.max-delay=5m
saga.recovery.jitter-ratio=0.2
saga.recovery.claim-lease=30s

monitoring.detect.interval=60000

# Mock PG 웹훅 HMAC 서명 secret (환경별로 반드시 변경)
mock.pg.webhook-secret=change-me-in-production

jwt.private-key-path=classpath:key/private_key.pem
jwt.public-key-path=classpath:key/public_key.pem
firebase.service-account-path=classpath:firebase/service-account.json
